<section class="content-page help-page"><span class="kicker">ช่วยเหลือ & ข้อมูล</span><h1>ศูนย์ช่วยเหลือ</h1><p class="page-subtitle">คำถามที่พบบ่อยและช่องทางติดต่อทีมงาน</p><div class="help-grid"><div class="faq-list"><div class="faq" *ngFor="let faq of faqs; let i = index"><button type="button" [attr.aria-expanded]="expandedFaq === i" (click)="expandedFaq = expandedFaq === i ? -1 : i">{{ faq.q }} <span>{{ expandedFaq === i ? '−' : '+' }}</span></button><p *ngIf="expandedFaq === i">{{ faq.a }}</p></div></div><form class="help-form" (ngSubmit)="sendQuestion()"><h2>ฝากคำถามไว้</h2><label for="question">ข้อความของคุณ</label><textarea id="question" name="question" [(ngModel)]="question" rows="5" required placeholder="พิมพ์คำถามที่นี่"></textarea><button class="button-primary" type="submit" [disabled]="!question.trim()">ส่งคำถาม</button><small>แบบฟอร์มนี้เป็นต้นแบบ ยังไม่ส่งข้อความไปยังเจ้าหน้าที่</small></form></div></section>
