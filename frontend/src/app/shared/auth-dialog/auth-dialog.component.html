<div class="modal-backdrop" *ngIf="dialog" (click)="dismiss.emit()"><section class="modal" role="dialog" aria-modal="true" [attr.aria-label]="dialog === 'login' ? 'เข้าสู่ระบบ' : 'ลงทะเบียน'" (click)="$event.stopPropagation()"><button class="panel-close" type="button" (click)="dismiss.emit()" aria-label="ปิด">×</button><span class="kicker">Pewfect Portal</span><h2>{{ dialog === 'login' ? 'เข้าสู่ระบบ' : dialog === 'shop' ? 'สมัครเป็นพาร์ทเนอร์ร้านค้า' : dialog === 'account' ? 'บัญชีผู้ใช้' : 'ลงทะเบียน' }}</h2><p *ngIf="dialog === 'account'">ยังไม่ได้เข้าสู่ระบบ เลือกดำเนินการต่อ</p><div class="account-actions" *ngIf="dialog === 'account'"><button class="button-primary" type="button" (click)="openDialog.emit('login')">เข้าสู่ระบบ</button><button class="button-light" type="button" (click)="openDialog.emit('register')">สร้างบัญชี</button></div><form *ngIf="dialog !== 'account'" (ngSubmit)="submitForm()"><label *ngIf="dialog !== 'login'" for="display-name">{{ dialog === 'shop' ? 'ชื่อร้านค้า' : 'ชื่อที่แสดง' }}</label><input *ngIf="dialog !== 'login'" id="display-name" name="displayName" [(ngModel)]="displayName" required placeholder="กรอกชื่อ"><label for="email">อีเมล</label><input id="email" name="email" type="email" [(ngModel)]="email" required placeholder="name@example.com"><label *ngIf="dialog === 'login'" for="password">รหัสผ่าน</label><input *ngIf="dialog === 'login'" id="password" name="password" type="password" [(ngModel)]="password" required placeholder="รหัสผ่าน"><button class="button-primary full" type="submit">{{ dialog === 'login' ? 'เข้าสู่ระบบ' : 'ส่งข้อมูล' }}</button><small>ฟอร์มตัวอย่างยังไม่เชื่อม API บัญชีผู้ใช้ และยังไม่บันทึกข้อมูล</small></form></section></div>
